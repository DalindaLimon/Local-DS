name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg shellcheck

      - name: Python packages
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      - name: Shellcheck
        run: shellcheck install.sh docker/entrypoint.sh scripts/*.sh

      - name: JavaScript syntax
        run: node --check app/static/app.js && node --check app/static/sw.js

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: localds:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run -d --name sf -p 8080:8080 -e SECRET_KEY=ci-secret localds:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/healthz
          docker exec -u 1000:1000 sf python -m app.seed --no-videos
          docker exec -u 1000:1000 sf python -m yt_dlp --version
          docker logs sf
